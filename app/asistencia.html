<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Zentraliza</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230D9488%22/><text x=%2250%25%22 y=%2252%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22900%22 font-size=%2265%22 fill=%22%23ffffff%22>Z</text></svg>">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Mismos estilos base del App Shell */
        :root { --bg-body: #F8FAFC; --bg-card: #ffffff; --text-main: #1E293B; --text-muted: #64748b; --border: #e2e8f0; --primary: #0D9488; --accent: #F59E0B; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --kanban-bg: #f1f5f9; --font-main: 'Inter', system-ui, sans-serif; --font-heading: 'Montserrat', sans-serif; }
        body.dark-mode { --bg-body: #0F172A; --bg-card: #1e293b; --text-main: #F8FAFC; --text-muted: #94a3b8; --border: #334155; --kanban-bg: #0b1121; }
        * { box-sizing: border-box; font-family: var(--font-main); }
        body { margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main); transition: 0.3s; display: flex; min-height: 100vh; overflow-x: hidden; min-width: 1200px;} /* Min-width para que el Kanban no se aplaste */
        h1, h2, h3 { font-family: var(--font-heading); margin-top: 0; }

        /* SIDEBAR (Idéntico a inicio) */
        .sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px 20px; position: fixed; height: 100vh; z-index: 100;}
        .logo { font-family: var(--font-heading); font-size: 24px; font-weight: 900; color: var(--text-main); letter-spacing: -1px; margin-bottom: 40px; padding-left: 10px;}
        .logo span { color: var(--primary); }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { padding: 12px 15px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .nav-item:hover { background: var(--bg-body); color: var(--primary); }
        .nav-item.active { background: rgba(13, 148, 136, 0.1); color: var(--primary); }
        .user-widget { padding-top: 20px; border-top: 1px solid var(--border); }
        .user-name { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; display: block; padding-left: 10px;}
        .btn-shell { width: 100%; text-align: left; background: transparent; border: none; padding: 10px; color: var(--text-muted); font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 6px; transition: 0.2s;}
        .btn-shell:hover { background: var(--bg-body); color: var(--text-main); }
        .btn-shell.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* MAIN CONTENT Y KANBAN */
        .main-content { margin-left: 260px; flex: 1; padding: 40px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .page-title { font-size: 28px; color: var(--text-main); margin: 0; }
        
        #realtime-badge { font-weight: 600; font-size: 12px; background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; color: var(--success); border: 1px solid var(--success); display: flex; align-items: center; gap: 6px;}
        .dot { width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .card { background: var(--bg-card); border-radius: 12px; padding: 25px; border: 1px solid var(--border); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg-body); padding-bottom: 15px; margin-bottom: 20px;}
        
        /* Botón Consolidar */
        #btn-consolidar { background-color: var(--text-muted); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.3s; }
        #btn-consolidar.active { background-color: var(--accent); color: #1E293B; animation: pulse 1.5s infinite; transform: scale(1.02); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }

        /* KANBAN (Ajustado para pantalla completa) */
        .kanban-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .kanban-col { background: var(--kanban-bg); padding: 15px; border-radius: 8px; min-height: 500px; border: 1px dashed var(--border); }
        .kanban-col h3 { text-align: center; font-size: 15px; margin: 0 0 20px 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        
        .ejecutivo-card { background: var(--bg-card); border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 10px; cursor: grab; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--text-muted); transition: 0.1s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .ejecutivo-card:active { transform: scale(0.95); opacity: 0.8; }
        .ejecutivo-card strong { font-size: 14px; font-weight: 600; pointer-events: none;}
        .ejecutivo-card select { padding: 4px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-body); color: var(--text-main); outline: none;}
        
        #toast-sync { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; display: none; z-index: 1000; font-weight: 600; font-size: 14px;}
    </style>
</head>
<body>

    <div id="toast-sync">🔄 Sincronizando datos...</div>

<aside class="sidebar">
        <div style="margin-bottom: 40px; padding-left: 10px;">
            <div class="logo" style="margin-bottom: 0; padding-left: 0;">Zentraliza<span>.</span></div>
            <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; margin-top: -5px;">HLF - ESPEX</div>
        </div>
        <nav class="nav-menu">
            <a href="inicio.html" class="nav-item">🏠 Inicio</a>
            <a href="asistencia.html" class="nav-item">📊 Asistencia</a>
            <a href="bitacora.html" class="nav-item">📋 Bitácora</a>
            <a href="dashboard.html" class="nav-item">📈 Dashboard</a>
        </nav>
        <div class="user-widget">
            <span class="user-name" id="user-display-name">Cargando...</span>
            <button class="btn-shell" onclick="toggleModoOscuro()">🌙 Alternar Tema</button>
            <button class="btn-shell danger" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1 class="page-title">Asignación Operativa</h1>
            <span id="realtime-badge"><span class="dot"></span> Tiempo Real Activo</span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 style="color: var(--primary); font-size: 20px; margin:0;">Tablero de Servicios (Kanban)</h2>
                <button id="btn-consolidar" onclick="consolidarAsistencia()">💾 Consolidar Asistencia</button>
            </div>
            
            <div class="kanban-board">
                <div class="kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'Mesa Central')">
                    <h3>Mesa Central</h3><div class="kanban-items" id="col-Mesa-Central"></div>
                </div>
                <div class="kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'Ingresos')">
                    <h3>Ingresos</h3><div class="kanban-items" id="col-Ingresos"></div>
                </div>
                <div class="kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'Bloqueo')">
                    <h3>Bloqueo</h3><div class="kanban-items" id="col-Bloqueo"></div>
                </div>
                <div class="kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'CallBack')">
                    <h3>CallBack</h3><div class="kanban-items" id="col-CallBack"></div>
                </div>
                <div class="kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'WhatsApp')">
                    <h3>WhatsApp</h3><div class="kanban-items" id="col-WhatsApp"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const motorSupabase = window.supabase.createClient(
            'https://lxjavcebbewkngtubkvc.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4amF2Y2ViYmV3a25ndHVia3ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjMzMzYsImV4cCI6MjA5NDc5OTMzNn0.FD3H_L2jtBx4Ok4CrXbxI78Uh7c3tsrdecZLupmAZDo'
        );
        
        let nombreAdminActivo = ""; 
        let dbData = { asistencia: [], usuarios: [] };
        let hayCambiosSinGuardar = false;

        const serviciosPorDefecto = {
            'Andreina Villalon': 'Bloqueo', 'Oscar Hidalgo': 'Bloqueo', 'Lorena Rodriguez': 'Bloqueo',
            'Miriam Bruges': 'Ingresos', 'Cristobal Fernandez': 'Ingresos', 'Carla Garay': 'Ingresos', 'Jorge Yanez': 'Ingresos', 'Maria Paz Nuñez': 'Ingresos',
            'Diego Cea': 'Mesa Central', 'Edith Ossandon': 'Mesa Central', 'Johanna Herrera': 'Mesa Central', 'Lesli Agudelo': 'Mesa Central',
            'Cristina Barón': 'Mesa Central', 'Valentina Gonzalez': 'Mesa Central', 'Paola Herrera': 'Mesa Central', 'Adrian Manzanilla': 'Mesa Central', 'María Faría': 'Mesa Central'
        };

        window.onload = async () => {
            if (localStorage.getItem('modo_oscuro') === 'true') document.body.classList.add('dark-mode');
            
            const { data: { session } } = await motorSupabase.auth.getSession();
            if (!session) { window.location.href = '../index.html'; return; }
            
            nombreAdminActivo = session.user.email.split('@')[0];
            document.getElementById('user-display-name').innerText = "👤 " + nombreAdminActivo;

            cargarDatosIniciales();
            motorSupabase.channel('asistencia-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'asistencia' }, () => {
                if (!hayCambiosSinGuardar) { mostrarToast("🔄 Asistencia actualizada en otra pantalla"); cargarDatosIniciales(); }
            }).subscribe();
        };

        function toggleModoOscuro() { document.body.classList.toggle('dark-mode'); localStorage.setItem('modo_oscuro', document.body.classList.contains('dark-mode')); }
        async function cerrarSesion() { await motorSupabase.auth.signOut(); window.location.href = '../index.html'; }
        function mostrarToast(msg) { const t = document.getElementById('toast-sync'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
        function obtenerFecha() { const now = new Date(); return `${now.toLocaleDateString('es-CL')} ${now.toLocaleTimeString('es-CL', {hour: '2-digit', minute:'2-digit'})}`; }
        function generarIdSeguro() { return Math.floor(Math.random() * 900000000) + 100000000; }

        async function cargarDatosIniciales() {
            const [asi, usu] = await Promise.all([
                motorSupabase.from('asistencia').select('*').order('id', { ascending: false }),
                motorSupabase.from('usuarios').select('*').eq('estado', 'Activo')
            ]);
            dbData.asistencia = asi.data || []; dbData.usuarios = usu.data || [];
            renderKanban();
        }

        /* --- KANBAN LOGIC --- */
        function renderKanban() {
            if(hayCambiosSinGuardar) return; 
            document.querySelectorAll('.kanban-items').forEach(el => el.innerHTML = '');
            const hoy = new Date().toLocaleDateString('es-CL');
            
            dbData.usuarios.filter(u => u.rol === 'Ejecutivo').forEach(ej => {
                let reg = dbData.asistencia.filter(a => a.nombre_ejecutivo === ej.nombre && a.fecha.includes(hoy));
                let serv = reg.length ? reg[0].grupo : (serviciosPorDefecto[ej.nombre] || 'Mesa Central');
                let est = reg.length ? reg[0].estado : 'Presente';
                let col = document.getElementById(`col-${serv.replace(/ /g, '-')}`) || document.getElementById('col-Mesa-Central');
                
                col.innerHTML += `<div class="ejecutivo-card" style="border-left-color: var(--${est === 'Ausente' ? 'danger' : (est === 'Licencia' ? 'warning' : 'success')})" draggable="true" ondragstart="drag(event, '${ej.nombre}')" id="card-${ej.nombre.replace(/\s/g, '')}" data-nombre="${ej.nombre}">
                        <strong>${ej.nombre.split(' ')[0]}</strong>
                        <select onchange="marcarCambioLocal(this)">
                            <option value="Presente" ${est === 'Presente' ? 'selected' : ''}>Pres.</option>
                            <option value="Ausente" ${est === 'Ausente' ? 'selected' : ''}>Aus.</option>
                            <option value="Licencia" ${est === 'Licencia' ? 'selected' : ''}>Lic.</option>
                        </select></div>`;
            });
        }

        function drag(ev, nom) { ev.dataTransfer.setData("nombre", nom); }
        function allowDrop(ev) { ev.preventDefault(); }
        function drop(ev, serv) {
            ev.preventDefault();
            document.getElementById(`col-${serv.replace(/ /g, '-')}`).appendChild(document.getElementById(`card-${ev.dataTransfer.getData("nombre").replace(/\s/g, '')}`));
            activarBotonConsolidar();
        }
        function marcarCambioLocal(sel) { 
            let v = sel.value; sel.parentElement.style.borderLeftColor = `var(--${v === 'Ausente' ? 'danger' : (v === 'Licencia' ? 'warning' : 'success')})`; 
            activarBotonConsolidar(); 
        }
        function activarBotonConsolidar() { hayCambiosSinGuardar = true; const b = document.getElementById('btn-consolidar'); b.classList.add('active'); b.innerText = '⚠️ Guardar Asistencia'; }

        async function consolidarAsistencia() {
            const b = document.getElementById('btn-consolidar'); b.innerText = 'Guardando...'; b.classList.remove('active');
            let datos = []; let base = generarIdSeguro(); let f = obtenerFecha(); let idx = 0;
            document.querySelectorAll('.kanban-col').forEach(col => {
                let s = col.parentElement.querySelector('h3').innerText;
                col.querySelectorAll('.ejecutivo-card').forEach(c => {
                    datos.push({ id: base + idx++, fecha: f, autor_registro: nombreAdminActivo, nombre_ejecutivo: c.getAttribute('data-nombre'), grupo: s, estado: c.querySelector('select').value });
                });
            });
            if (!(await motorSupabase.from('asistencia').insert(datos)).error) { 
                hayCambiosSinGuardar = false; b.innerText = '✔️ Guardado'; setTimeout(() => b.innerText = '💾 Consolidar Asistencia', 3000); cargarDatosIniciales(); 
            }
        }
    </script>
</body>
</html>
